<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">

  {%- include head.html -%}

  {% assign settings = site.data.settings['settings'] %}

  <body class="{% if page.layout == 'builder' %} home{% endif %}{% if page.layout == 'blog' or page.layout == 'archive' %} blog{% endif %}{% if page.layout == 'post' or page.layout == 'works-single' or page.layout == 'page' or page.layout == 'error' %} page{% endif %}{% if settings.skin == 'light' %} light-skin{% endif %}{% if settings.skin == 'dark' %} dark-skin{% endif %}">

    <a href="#main-content" class="skip-to-content">Skip to content</a>

    <div class="container-page ">

      {%- include preloader.html -%}

      {%- include header.html -%}

      <!-- Wrapper -->
  		<main id="main-content" class="wrapper{% if page.layout == 'works-single' or page.layout == 'page' %} portfolio-template{% endif %}{% if page.layout == 'post' %} single-post{% endif %}">
        {{ content }}
      </main>

      {%- include footer.html -%}

    </div>

    <!-- cursor -->
    <div class="cursor"></div>

    {%- include scripts.html -%}

  </body>

</html>
